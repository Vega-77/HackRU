[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handson-physics-backend"
version = "0.1.0"
description = "Streaming backend for HandsOn Physics"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["handson_backend*"]
